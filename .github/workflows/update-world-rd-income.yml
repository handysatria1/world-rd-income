name: Update worldwide R&D charts

on:
  schedule:
    # Mondays at 06:23 UTC; avoid the busiest start-of-hour period.
    - cron: '23 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-world-rd-income.yml'
      - 'figures/world-rd-income/**'

permissions:
  contents: read
  pages: read

concurrency:
  group: world-rd-income-pages
  cancel-in-progress: false

jobs:
  build:
    # Scheduled/manual/push publications always use the repository's default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: read
    defaults:
      run:
        working-directory: figures/world-rd-income
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: figures/world-rd-income/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up JavaScript verification
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check interactive calculations
        run: |
          node test_explorer.js
          node test_breakdown.js
          node test_broad_sector.js
          node test_sector_economy.js
          node test_rd_industry.js
          node test_income.js
          python -m unittest test_snapshot_indicators.py
      - name: Check R&D units, annual joins and sector-field accounting
        run: python -m unittest test_nominal_rd.py test_sector_field_rd.py test_release_downloads.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Refresh OECD, World Bank, UNESCO, Eustat and ONS data
        run: python download_data.py --refresh
      - name: Recalculate and validate all figures
        run: python reproduce_figures.py
      - name: Independently verify sector-field database and workbook
        run: python verify_sector_field.py
      - name: Independently verify Basque conversions and all four views
        run: |
          python verify_basque.py
          node test_explorer.js --built
      - name: Independently verify funding, research types and stacked charts
        run: |
          python verify_breakdown.py
          node test_breakdown.js --built
      - name: Prepare website and reproducible download
        # The supplement has a separate retrieval manifest and build timestamp.
        # It is joined to this run's validated R&D/income build.
        run: |
          python industry_sources.py --refresh
          python industry_data.py
          python verify_industry.py
          python broad_sector_sources.py --refresh
          python broad_sectors.py
          python verify_broad_sectors.py
          node test_broad_sector.js --built
          python broad_sector_figures.py
          python sector_economy_sources.py --refresh
          python sector_economy.py
          python verify_sector_economy.py
          node test_sector_economy.js --built
          python sector_economy_figures.py
          python rd_industry_sources.py --refresh
          python -m unittest test_rd_industry.py
          python rd_industry.py
          python verify_rd_industry.py
          node test_rd_industry.js --built
          python income_sources.py --refresh
          python basque_innovation_sources.py --refresh
          python income_data.py
          python -m unittest test_absorptive_capacity.py
          node test_absorptive_capacity_chart.js
          python verify_basque_innovation.py
          python government_industry_sources.py --refresh
          python government_industry.py
          python research_groups.py
          python verify_government_industry.py
          node test_research_groups.js --built
          python build_site.py --destination "$GITHUB_WORKSPACE/_site"
          python verify_broad_site.py --site "$GITHUB_WORKSPACE/_site"
          python verify_dashboard.py --site "$GITHUB_WORKSPACE/_site" --before-distribution
      - name: Publish large downloads separately from Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python release_downloads.py --site "$GITHUB_WORKSPACE/_site" \
            --assets "$RUNNER_TEMP/rd-downloads" --repository "$GITHUB_REPOSITORY" \
            --release-tag "data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --publish --target "$GITHUB_SHA"
      - name: Add current results to run summary
        run: cat data/current_results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
